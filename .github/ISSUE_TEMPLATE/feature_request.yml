name: Feature request
description: 提出符合 local-first 邊界的功能建議
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 不接受雇主評分、招募篩選、欺瞞偵測、情緒或其他心理推論需求。
  - type: textarea
    id: problem
    attributes:
      label: 要解決的問題
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 預期結果
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: local-first 與隱私影響
      description: 請說明資料是否離開裝置、權限是否改變。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代方案
    validations:
      required: true
