name: Bug report
description: 回報可重現的 Raise Room 問題
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 請勿貼出 Key、token、私人逐字稿、音訊、影像或未遮蔽設定截圖。
  - type: textarea
    id: problem
    attributes:
      label: 問題描述
      description: 請用一句到數句話說明實際遇到的問題與影響。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 重現步驟
      description: 從乾淨啟動到問題發生的最小步驟。
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 預期與實際結果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser、OS 與 Node 版本
      placeholder: Chrome 140 / macOS 15 / Node 24.13.1
    validations:
      required: true
  - type: dropdown
    id: manager_mode
    attributes:
      label: 模式
      options:
        - 本機 fallback
        - 已設定 Perxona 動態主管
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs 或 console output（選填）
      description: 貼出前請直接遮蔽 Key、token、私人逐字稿、個人資料與任何設定值。
